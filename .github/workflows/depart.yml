name: Depart trains

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: train-station-depart
  cancel-in-progress: false

jobs:
  depart:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REGISTRATION_STATION_REPO: Ian729/train-station
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Train Station
        run: python -m pip install .

      - name: Validate registry
        run: train-station validate

      - name: Depart
        run: train-station depart

      - name: Upload journey report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: train-station-results
          path: artifacts/train-station-results.json
          if-no-files-found: warn
