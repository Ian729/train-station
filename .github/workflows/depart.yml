name: Depart trains

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read

jobs:
  depart:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Train Station
        run: pip install .

      - name: Depart
        run: train-station depart

      - name: Upload journey report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: train-station-results
          path: artifacts/train-station-results.json
          if-no-files-found: warn
